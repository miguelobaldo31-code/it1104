<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, serverTimestamp,
    onSnapshot, getDocs, query, orderBy, addDoc, deleteDoc
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdUPKe8aXKcEB34JPlzN0UZD38mw8EPwU",
    authDomain: "bsit1104-f6ac4.firebaseapp.com",
    projectId: "bsit1104-f6ac4",
    storageBucket: "bsit1104-f6ac4.firebasestorage.app",
    messagingSenderId: "948891720373",
    appId: "1:948891720373:web:ccac01737a8617c629bcfc",
    measurementId: "G-4FFCTL9GE3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const avatarsRef = collection(db, "avatars");
  const galleryRef = collection(db, "gallery");

  window.sharedAvatars = {
    async upload(id, type, file) {
      const imageRef = ref(storage, `avatars/${type}_${id}`);
      await uploadBytes(imageRef, file);
      const url = await getDownloadURL(imageRef);

      await setDoc(doc(db, "avatars", `${type}_${id}`), {
        id: String(id),
        type,
        url,
        updatedAt: serverTimestamp()
      });

      return url;
    },

    watch(callback) {
      return onSnapshot(
        avatarsRef,
        snapshot => callback(snapshot.docs.map(item => item.data())),
        error => console.error("Avatar listener error:", error)
      );
    }
  };

  window.sharedGallery = {
    async load() {
      const snapshot = await getDocs(
        query(galleryRef, orderBy("createdAt", "desc"))
      );
      return snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));
    },

    async add(photo) {
      const result = await addDoc(galleryRef, {
        title: photo.title,
        caption: photo.caption,
        url: photo.url,
        createdAt: serverTimestamp()
      });
      return result.id;
    },

    async remove(id) {
      await deleteDoc(doc(db, "gallery", String(id)));
    }
  };
</script>
